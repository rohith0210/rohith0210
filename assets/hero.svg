<!-- Simple dark hero banner (editable). Save as assets/hero.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="200" viewBox="0 0 980 200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#071026"/>
      <stop offset="1" stop-color="#0f1724"/>
    </linearGradient>
    <style>
      .title { fill: #58A6FF; font-family: 'Fira Code', monospace; font-weight:700; font-size:36px; }
      .subtitle { fill: #9AA8C6; font-family: 'Fira Code', monospace; font-size:18px; }
      .tag { fill: #6EE7B7; font-family: 'Fira Code', monospace; font-size:13px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)" rx="14"/>
  <text x="40" y="70" class="title">ROHITH</text>
  <text x="40" y="105" class="subtitle">Embedded Linux Engineer • Linux Kernel • STM32</text>

  <g transform="translate(40,130)">
    <text class="tag">C</text>
    <text class="tag" x="40">C++</text>
    <text class="tag" x="110">Buildroot</text>
    <text class="tag" x="220">Yocto</text>
    <text class="tag" x="330">Drivers</text>
  </g>

  <!-- subtle animated pulse -->
  <circle cx="900" cy="40" r="18" fill="#58A6FF">
    <animate attributeName="r" values="16;22;16" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="4s" repeatCount="indefinite" />
  </circle>
</svg>
